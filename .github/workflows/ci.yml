name: CI

on:
    push:
        branches: [develop]
    # Deliberately not listing feature branches under `push` as well: that would
    # run this workflow twice per push to a branch with an open pull request, once
    # for `push` and once for `synchronize`.
    pull_request:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: ${{ github.ref != 'refs/heads/develop' }}

jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: ./.github/actions/setup
            - run: npm run lint

    format-check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: ./.github/actions/setup
            - run: npm run format:check

    typecheck:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: ./.github/actions/setup
            - run: npm run typecheck

    knip:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: ./.github/actions/setup
            - run: npm run knip

    depcruise:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: ./.github/actions/setup
            - run: npm run depcruise

    build:
        name: Build & test
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: ./.github/actions/setup

            # Builds the library then the plugin bundle (webpack inlines the library,
            # so the shipped bundle stays self-contained).
            - run: npm run build

            # Fast and browserless by design.
            - run: npm test

            # apps/camunda-modeler-i18n-plugin/dist/ is committed and copied straight into a user's plugins
            # folder, so a stale bundle means merged translations reach nobody.
            - name: Committed bundle is current
              run: |
                  if ! git diff --exit-code --stat apps/camunda-modeler-i18n-plugin/dist/; then
                    echo "::error::apps/camunda-modeler-i18n-plugin/dist/ is out of date. Run 'npm run build' and commit the result."
                    exit 1
                  fi

    integration:
        name: Real editors
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: ./.github/actions/setup
            - name: Install Chromium
              run: npx playwright install --with-deps chromium
            # bpmn-js needs SVG layout jsdom does not implement, so these drive real
            # editors in a browser. (pretest:integration builds the library first.)
            - run: npm run test:integration

    e2e:
        name: Real Camunda Modeler
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: ./.github/actions/setup
            - run: npm run build

            - name: Cache the Modeler release
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ~/.cache/camunda-modeler-e2e
                  key: camunda-modeler-${{ hashFiles('apps/camunda-modeler-i18n-plugin/package.json') }}

            - name: Download the Modeler
              run: npm run e2e:setup

            # Electron is headed, so a Linux runner needs a virtual display.
            - name: End-to-end tests
              run: xvfb-run --auto-servernum npm run test:e2e

    pin-check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: Miragon/pin-npm-dependencies@58fe24377aef66748a1444ff69ab05e3f938a798 # v1.2.1

    dependency-review:
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

    translations:
        name: Translation drift
        runs-on: ubuntu-latest
        permissions:
            contents: read
            issues: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: ./.github/actions/setup

            # Hermetic: the vendored bpmn-js key list plus the pinned bundles. The
            # scheduled workflow is what checks against newer Modeler releases.
            - name: Check translations
              id: check
              run: |
                  npm run build:lib
                  {
                    echo 'report<<REPORT_EOF'
                    node apps/camunda-modeler-i18n-plugin/test/drift/report.mjs || echo "__FAILED__"
                    echo 'REPORT_EOF'
                  } >> "$GITHUB_OUTPUT"

            # Pull requests cannot write issues from forks, and one issue per pull
            # request would be noise. They still fail below.
            - name: Report drift
              if: contains(steps.check.outputs.report, '__FAILED__') && github.event_name != 'pull_request'
              uses: ./.github/actions/drift-issue
              with:
                  title: Translations are behind the Camunda Modeler
                  report: ${{ steps.check.outputs.report }}
                  context: >-
                      The translation check failed on `develop`. Some strings the Modeler
                      asks for have no translation, or a locale lost coverage.

            - name: Fail on drift
              if: contains(steps.check.outputs.report, '__FAILED__')
              run: |
                  echo "::error::Translation drift detected. See the report above."
                  exit 1
