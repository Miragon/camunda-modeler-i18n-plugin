name: CI

on:
  pull_request:
    types: [ opened, synchronize, reopened ]
  # Deliberately only `develop`. Listing feature branches here as well would make
  # every push to a branch with an open pull request run this workflow twice -
  # once for `push`, once for `synchronize`.
  push:
    branches: [ develop ]

# `head_ref` on a pull request, `ref` on a push: one in-flight run per branch, and
# a new push cancels the run it supersedes. Falling back to `ref` keeps this
# correct if the push trigger above is ever widened.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build & test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 20 builds the published bundle in release.yml; 24 is what developers run.
        node: [ 20, 24 ]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      # Catches the breakage class that made the plugin stop working:
      # plugin-helpers v6 moved its component exports and the build failed for
      # months, unnoticed.
      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  integration:
    name: Real editors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # bpmn-js needs SVG layout jsdom does not implement, so these drive real
      # editors in a browser.
      - name: Integration tests
        run: npm run test:integration

  e2e:
    name: Real Camunda Modeler
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build the plugin
        run: npm run build

      - name: Cache the Modeler release
        uses: actions/cache@v4
        with:
          path: ~/.cache/camunda-modeler-e2e
          key: camunda-modeler-${{ hashFiles('package.json') }}

      # A 150 MB download is infrastructure, not a test: keeping it in its own
      # step means a network failure does not read as a broken plugin.
      - name: Download the Modeler
        run: npm run e2e:setup

      # Electron is headed, so a Linux runner needs a virtual display.
      - name: End-to-end tests
        run: xvfb-run --auto-servernum npm run test:e2e

  bundle:
    name: Committed bundle is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Pinned, not a matrix: the comparison below is only stable if this
          # matches the Node that release.yml builds with.
          node-version: 20
          cache: npm

      - run: npm ci

      # dist/ is committed and copied straight into a user's plugins folder, so
      # a stale bundle means merged translations reach nobody.
      - name: Rebuild and compare
        run: |
          npm run build
          if ! git diff --exit-code --stat dist/; then
            echo "::error::dist/ is out of date. Run 'npm run build' and commit the result."
            exit 1
          fi

  translations:
    name: Translation drift
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Hermetic: the vendored bpmn-js key list plus the pinned bundles. The
      # scheduled workflow is what checks against newer Modeler releases.
      - name: Check translations
        id: check
        run: |
          {
            echo 'report<<REPORT_EOF'
            node test/drift/report.mjs || echo "__FAILED__"
            echo 'REPORT_EOF'
          } >> "$GITHUB_OUTPUT"

      # Pull requests cannot write issues from forks, and one issue per PR would
      # be noise. They still fail below.
      - name: Report drift
        if: contains(steps.check.outputs.report, '__FAILED__') && github.event_name != 'pull_request'
        uses: ./.github/actions/drift-issue
        with:
          title: Translations are behind the Camunda Modeler
          report: ${{ steps.check.outputs.report }}
          context: >-
            The translation check failed on `develop`. Some strings the Modeler
            asks for have no translation, or a locale lost coverage.

      - name: Fail on drift
        if: contains(steps.check.outputs.report, '__FAILED__')
        run: |
          echo "::error::Translation drift detected. See the report above."
          exit 1
