name: Release Please

on:
    push:
        branches: [develop]
    workflow_dispatch:

permissions:
    contents: write
    pull-requests: write

jobs:
    release-please:
        runs-on: ubuntu-latest
        outputs:
            translations_released: ${{ steps.release.outputs['packages/translations--release_created'] }}
            plugin_released: ${{ steps.release.outputs['apps/camunda-modeler-i18n-plugin--release_created'] }}
            plugin_tag: ${{ steps.release.outputs['apps/camunda-modeler-i18n-plugin--tag_name'] }}
        steps:
            # A GitHub App token (not the default GITHUB_TOKEN) so the release PR's
            # own checks run. Provision the app once at the org level and expose
            # RELEASE_PLEASE_APP_CLIENT_ID (var) + RELEASE_PLEASE_APP_PRIVATE_KEY (secret).
            - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
              id: app-token
              with:
                  app-id: ${{ vars.RELEASE_PLEASE_APP_CLIENT_ID }}
                  private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
            - id: release
              uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
              with:
                  token: ${{ steps.app-token.outputs.token }}
                  config-file: release-please-config.json
                  manifest-file: .release-please-manifest.json

    # Publish the shared library to npm via OIDC trusted publishing.
    publish-npm:
        needs: release-please
        if: needs.release-please.outputs.translations_released == 'true'
        permissions:
            contents: read
            id-token: write
        uses: ./.github/workflows/publish-npm-package.yml
        with:
            package: translations

    # Attach the Camunda Modeler plugin zip (index.js + dist/) to its GitHub release.
    publish-plugin:
        needs: release-please
        if: needs.release-please.outputs.plugin_released == 'true'
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: ./.github/actions/setup
            - run: npm run build
            - name: Package the plugin
              run: |
                  cd apps/camunda-modeler-i18n-plugin
                  zip -r "$GITHUB_WORKSPACE/${{ needs.release-please.outputs.plugin_tag }}.zip" index.js dist/
            - name: Attach to the release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  gh release upload "${{ needs.release-please.outputs.plugin_tag }}" \
                    "${{ needs.release-please.outputs.plugin_tag }}.zip" --clobber
