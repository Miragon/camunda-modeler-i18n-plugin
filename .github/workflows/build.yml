name: Build

on:
  push:
    branches: [ develop ]
  # Deliberately not listing feature branches under `push` as well: that would
  # run this workflow twice per push to a branch with an open pull request, once
  # for `push` and once for `synchronize`.
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/develop' }}

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Miragon/pin-npm-dependencies@58fe24377aef66748a1444ff69ab05e3f938a798 # v1.2.1
      # 24 is Active LTS, what `.nvmrc` pins and what release.yml publishes with.
      # No matrix: the shipped bundle is webpack output running inside Electron,
      # so a user's Node version never enters into it.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # Catches the breakage class that made the plugin stop working:
      # camunda-modeler-plugin-helpers v6 moved its component exports and the
      # build failed for months, unnoticed.
      - run: npm run build

      # Fast and browserless by design, so this job needs no extra setup.
      - run: npm test

      # dist/ is committed and copied straight into a user's plugins folder, so a
      # stale bundle means merged translations reach nobody. Reuses the build
      # above rather than repeating it in a job of its own.
      - name: Committed bundle is current
        run: |
          if ! git diff --exit-code --stat dist/; then
            echo "::error::dist/ is out of date. Run 'npm run build' and commit the result."
            exit 1
          fi

  integration:
    name: Real editors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # bpmn-js needs SVG layout jsdom does not implement, so these drive real
      # editors in a browser.
      - run: npm run test:integration

  e2e:
    name: Real Camunda Modeler
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: Cache the Modeler release
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/camunda-modeler-e2e
          key: camunda-modeler-${{ hashFiles('package.json') }}

      # A 150 MB download is infrastructure, not a test: its own step means a
      # network failure does not read as a broken plugin.
      - name: Download the Modeler
        run: npm run e2e:setup

      # Electron is headed, so a Linux runner needs a virtual display.
      - name: End-to-end tests
        run: xvfb-run --auto-servernum npm run test:e2e

  translations:
    name: Translation drift
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # Hermetic: the vendored bpmn-js key list plus the pinned bundles. The
      # scheduled workflow is what checks against newer Modeler releases.
      - name: Check translations
        id: check
        run: |
          {
            echo 'report<<REPORT_EOF'
            node test/drift/report.mjs || echo "__FAILED__"
            echo 'REPORT_EOF'
          } >> "$GITHUB_OUTPUT"

      # Pull requests cannot write issues from forks, and one issue per pull
      # request would be noise. They still fail below.
      - name: Report drift
        if: contains(steps.check.outputs.report, '__FAILED__') && github.event_name != 'pull_request'
        uses: ./.github/actions/drift-issue
        with:
          title: Translations are behind the Camunda Modeler
          report: ${{ steps.check.outputs.report }}
          context: >-
            The translation check failed on `develop`. Some strings the Modeler
            asks for have no translation, or a locale lost coverage.

      - name: Fail on drift
        if: contains(steps.check.outputs.report, '__FAILED__')
        run: |
          echo "::error::Translation drift detected. See the report above."
          exit 1
