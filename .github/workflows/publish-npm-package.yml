name: Publish npm package

on:
    workflow_call:
        inputs:
            package:
                description: Package directory name under packages/
                required: true
                type: string

permissions:
    contents: read
    id-token: write

jobs:
    publish:
        runs-on: ubuntu-latest
        environment: npm
        permissions:
            contents: read
            id-token: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 24
                  registry-url: https://registry.npmjs.org
            - run: npm ci
            - run: npm run build -w packages/${{ inputs.package }}
            - name: Publish (skip if the version is already on npm)
              run: |
                  dir="packages/${{ inputs.package }}"
                  name="$(node -p "require('./$dir/package.json').name")"
                  version="$(node -p "require('./$dir/package.json').version")"
                  if npm view "$name@$version" version > /dev/null 2>&1; then
                    echo "$name@$version already published — skipping"
                  else
                    npm publish -w "$dir" --provenance --access public
                  fi
