name: Setup
description: Install Node 24 and restore dependencies with a clean, lockfile-pinned npm ci.

inputs:
    node-version:
        description: Node.js version.
        required: false
        default: '24'

runs:
    using: composite
    steps:
        - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
          with:
              node-version: ${{ inputs.node-version }}
              cache: npm
        - run: npm ci
          shell: bash
