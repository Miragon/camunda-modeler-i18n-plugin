name: Report translation drift
description: Opens a drift issue, or overwrites the body of the existing one.

inputs:
  title:
    description: Issue title, also used to find an existing issue.
    required: true
  label:
    description: Label applied to the issue and used to narrow the search.
    required: false
    default: i18n-drift
  report:
    description: The drift report to put in the issue body.
    required: true
  context:
    description: One line explaining what produced this report.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - uses: actions/github-script@v7
      env:
        DRIFT_TITLE: ${{ inputs.title }}
        DRIFT_LABEL: ${{ inputs.label }}
        DRIFT_REPORT: ${{ inputs.report }}
        DRIFT_CONTEXT: ${{ inputs.context }}
      with:
        script: |
          const title = process.env.DRIFT_TITLE;
          const label = process.env.DRIFT_LABEL;

          const body = [
            process.env.DRIFT_CONTEXT,
            '',
            'Fix it with:',
            '',
            '```bash',
            'npm run sync:upstream-keys   # follow the newest Modeler',
            'npm run harvest              # record strings only visible at runtime',
            'npm run check:translations   # see what is still missing',
            '```',
            '',
            'Then use the `/i18n-translate` skill to fill the gaps.',
            '',
            '<details><summary>Drift report</summary>',
            '',
            '```',
            process.env.DRIFT_REPORT || '(no output)',
            '```',
            '',
            '</details>',
            '',
            `_Updated automatically from ${context.workflow} — ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}_`
          ].join('\n');

          // Label-scoped search keeps this from ever touching a human's issue.
          const { data: open } = await github.rest.issues.listForRepo({
            owner: context.repo.owner,
            repo: context.repo.repo,
            state: 'open',
            labels: label
          });

          const existing = open.find(issue => issue.title === title);

          if (existing) {
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: existing.number,
              body
            });
            core.notice(`Updated #${existing.number}: ${title}`);
            return;
          }

          // Creating the label on demand; repos without it would 422 otherwise.
          try {
            await github.rest.issues.getLabel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: label
            });
          } catch {
            await github.rest.issues.createLabel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: label,
              color: 'fbca04',
              description: 'Translations are behind the Camunda Modeler'
            });
          }

          const { data: created } = await github.rest.issues.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            title,
            body,
            labels: [ label ]
          });

          core.notice(`Opened #${created.number}: ${title}`);
