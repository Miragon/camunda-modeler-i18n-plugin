version: 2
updates:
  # npm — grouped minor+patch, each major reviewed individually
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    labels:
      - "dependencies"
    commit-message:
      prefix: fix
      prefix-development: chore
      include: scope
    cooldown:
      default-days: 5
    open-pull-requests-limit: 10
    groups:
      production-dependencies:
        dependency-type: production
        update-types:
          - minor
          - patch
      development-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"

  # GitHub Actions — fully grouped (SHA-pinned, mostly mechanical)
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    labels:
      - "dependencies"
    commit-message:
      prefix: chore
      include: scope
    cooldown:
      default-days: 5
    groups:
      github-actions:
        patterns:
          - "*"
      github-actions-security:
        applies-to: security-updates
        patterns:
          - "*"
