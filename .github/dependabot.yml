version: 2
updates:
    # npm — keep coupled Babel updates together and Modeler updates separate
    - package-ecosystem: npm
      directory: '/'
      schedule:
          interval: weekly
      labels:
          - 'dependencies'
      commit-message:
          prefix: fix
          prefix-development: chore
          include: scope
      cooldown:
          default-days: 5
      open-pull-requests-limit: 10
      ignore:
          # TypeScript 7 cannot satisfy the current typescript-eslint peers.
          - dependency-name: typescript
            update-types:
                - version-update:semver-major
      groups:
          babel:
              patterns:
                  - '@babel/*'
          modeler-dependencies:
              patterns:
                  - camunda-bpmn-js
                  - camunda-dmn-js
              update-types:
                  - minor
                  - patch
          production-dependencies:
              dependency-type: production
              update-types:
                  - minor
                  - patch
          development-dependencies:
              dependency-type: development
              exclude-patterns:
                  - '@babel/*'
                  - camunda-bpmn-js
                  - camunda-dmn-js
              update-types:
                  - minor
                  - patch
          npm-security:
              applies-to: security-updates
              patterns:
                  - '*'

    # GitHub Actions — fully grouped (SHA-pinned, mostly mechanical)
    - package-ecosystem: github-actions
      directory: '/'
      schedule:
          interval: monthly
      labels:
          - 'dependencies'
      commit-message:
          prefix: chore
          include: scope
      cooldown:
          default-days: 5
      groups:
          github-actions:
              patterns:
                  - '*'
          github-actions-security:
              applies-to: security-updates
              patterns:
                  - '*'
